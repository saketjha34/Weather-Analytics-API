services:
  app:
    build: .
    container_name: weather_api_service
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1

  tests:
    build: .
    container_name: weather_api_tests
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
    command: >
      sh -c "pytest app/test -v"